name: Update model, picks and splits

on:
  schedule:
    # Hourly 10am to 1am ET, plus every 30 min in the evening window (cron is UTC; ET = UTC-5 in winter)
    - cron: "7 15-23 * * *"
    - cron: "7 0-6 * * *"
    - cron: "37 22-23 * * *"
    - cron: "37 0-3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache last season box scores
        uses: actions/cache@v4
        with:
          path: data
          key: cbb-data-${{ github.run_id }}
          restore-keys: cbb-data-
      - name: Run pipeline
        run: python -m model.run
      - name: Commit site data
        run: |
          git config user.name "hoops-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update picks and data $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')"
          git pull --rebase origin ${{ github.ref_name }}
          git push
